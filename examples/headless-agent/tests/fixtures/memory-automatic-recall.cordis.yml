# Real AgentLoop composition for automatic TencentDB recall.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: memory-automatic-recall-mock
              model: memory-automatic-recall-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Automatic memory recall test agent.'
      - insert:
          - id: memory-query
            name: './tests/fixtures/memory-query.ts'
          - id: memory-automatic-recall-mock
            name: './tests/fixtures/memory-automatic-recall-mock.ts'
          - id: memory-service
            name: '@deepseek-ai/dsh-experimental-memory'
            config:
              providers: [local, tencentdb]
              automaticRecall: true
              tencentdb:
                baseUrl: !!js process.env.DSH_TENCENTDB_TEST_URL
                serviceId: memory-1
                isolationBindings:
                  - workspace: !!js process.cwd()
                    teamId: team-1
                    agentId: agent-1
                    userId: user-1
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          compression: none
