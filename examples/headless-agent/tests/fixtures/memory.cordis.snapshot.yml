# Keyless real-app composition for the opt-in experimental memory tool.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: memory-mock
              model: memory-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless memory snapshot agent.'
      - insert:
          - id: memory-query
            name: './tests/fixtures/memory-query.ts'
          - id: memory-mock-llm
            name: './tests/fixtures/memory-mock-llm.ts'
          - id: memory-service
            name: '@deepseek-ai/dsh-experimental-memory'
          - id: memory-tool
            name: '@deepseek-ai/dsh-experimental-tool-memory'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          compression: none
