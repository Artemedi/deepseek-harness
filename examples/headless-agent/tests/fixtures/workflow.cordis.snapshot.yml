# Keyless real-app composition for the bounded coordinator/worker/review workflow.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: workflow-mock
              model: workflow-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless workflow snapshot agent.'
      - insert:
          - id: workflow-mock-llm
            name: './tests/fixtures/workflow-mock-llm.ts'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          compression: none
