# Opt-in experimental verifier composition. The provider key resolves through the
# standard credentials service; this fixture is keyless and overrides fetch in tests.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: verifier
  name: '@deepseek-ai/dsh-experimental-verifier'
  config:
    baseUrl: https://api.mistral.ai/v1
    model: mistral-small-2603
    apiKeyEnv: MISTRAL_API_KEY
    maxTokens: 64
    timeoutMs: 30000

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: tool-verifier
  name: '@deepseek-ai/dsh-experimental-tool-verifier'
